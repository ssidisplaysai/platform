services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: youth_sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
    ports: ["5432:5432"]
    volumes:
      - sports_pg:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sports -d youth_sports"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sports_pg:
