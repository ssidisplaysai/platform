name: Youth Sports Alpha CI
on:
  pull_request:
    paths: ["incubator/youth-sports-platform/**",".github/workflows/youth-sports-alpha-ci.yml"]
  push:
    branches: ["bootstrap/youth-sports-platform"]
    paths: ["incubator/youth-sports-platform/**",".github/workflows/youth-sports-alpha-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/youth-sports-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
