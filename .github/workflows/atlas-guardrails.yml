name: Atlas Guardrails

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  atlas-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run canonical quality gates
        run: npm run quality:ci

      - name: Run Atlas certification guardrails
        run: npm run atlas:certify
