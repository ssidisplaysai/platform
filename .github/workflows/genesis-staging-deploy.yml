name: Genesis Staging Deploy

on:
  workflow_call:
    inputs:
      confirm:
        description: Type DEPLOY-STAGING to authorize the staging deployment
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-STAGING to authorize the staging deployment
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: genesis-staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: genesis-staging-runtime
  ECS_CLUSTER: genesis-production
  ECS_SERVICE: genesis-staging-web
  TASK_FAMILY: genesis-staging-web
  CONTAINER_NAME: GenesisWebRuntime
  AWS_ACCOUNT_ID: "452630323448"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require explicit deployment confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "DEPLOY-STAGING" ]]; then
            echo "Deployment requires confirm=DEPLOY-STAGING" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: infra/genesis-staging-runtime-v1

      - name: Record the checked-out commit (github.sha is the caller's when invoked via the dispatcher)
        run: echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Share-to-Grow Jest suite
        run: npx jest src/modules/share-to-grow/__tests__ --runInBand

      - name: Share-to-Grow ESLint
        run: npx eslint "src/modules/share-to-grow/**/*.ts" "src/app/api/share-to-grow/**/*.ts" --max-warnings=0

      - name: Production Next.js build
        run: npm run build

      - name: Prove build contains webhook route
        run: |
          test -f .next/server/app/api/share-to-grow/woocommerce/webhook/route.js
          test -f .next/server/app/api/share-to-grow/shopify/webhook/route.js
          test -f .next/server/app/api/health/route.js

      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${{ env.GIT_SHA }} -t genesis-staging-runtime:${{ env.GIT_SHA }} .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GenesisGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Capture approved staging task-definition baseline
        id: baseline
        run: |
          set -euo pipefail
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].status' --output text)
          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "Staging service must already exist and be ACTIVE to preserve full runtime configuration." >&2
            echo "Use genesis-staging-infra/service bootstrap workflows for first-time creation." >&2
            exit 1
          fi
          PREVIOUS_TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$PREVIOUS_TD" --query 'taskDefinition' --output json > baseline-taskdef.json
          echo "previous_task_definition=$PREVIOUS_TD" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_STAGING_TASK_DEFINITION=$PREVIOUS_TD" >> "$GITHUB_ENV"

      - name: Guard against production targets
        run: |
          for v in "$ECR_REPOSITORY" "$ECS_SERVICE" "$TASK_FAMILY"; do
            case "$v" in *production*) echo "Refusing production target: $v"; exit 1;; esac
          done

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image and capture digest
        id: push
        run: |
          REPO_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ env.GIT_SHA }} >/dev/null 2>&1; then
            docker tag genesis-staging-runtime:${{ env.GIT_SHA }} "$REPO_URI:${{ env.GIT_SHA }}"
            docker push "$REPO_URI:${{ env.GIT_SHA }}"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ env.GIT_SHA }} --query 'imageDetails[0].imageDigest' --output text)
          case "$DIGEST" in sha256:*) ;; *) echo "bad digest: $DIGEST"; exit 1;; esac
          echo "image=$REPO_URI@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prove pushed image contains webhook route
        run: |
          docker run --rm --entrypoint test genesis-staging-runtime:${{ env.GIT_SHA }} -f .next/server/app/api/share-to-grow/woocommerce/webhook/route.js
          docker run --rm --entrypoint test genesis-staging-runtime:${{ env.GIT_SHA }} -f .next/server/app/api/share-to-grow/shopify/webhook/route.js

      - name: Build candidate task definition from approved staging baseline
        id: taskdef
        env:
          IMAGE_URI_WITH_DIGEST: ${{ steps.push.outputs.image }}
          GIT_COMMIT: ${{ env.GIT_SHA }}
        run: |
          node infra/staging/staging-taskdef-config-guard.mjs build \
            --baseline baseline-taskdef.json \
            --image "$IMAGE_URI_WITH_DIGEST" \
            --git-commit "$GIT_COMMIT" \
            --output taskdef.json
          node infra/staging/staging-taskdef-config-guard.mjs validate \
            --baseline baseline-taskdef.json \
            --candidate taskdef.json \
            --image "$IMAGE_URI_WITH_DIGEST" \
            --git-commit "$GIT_COMMIT"
          jq -e '
            .family=="genesis-staging-web"
            and (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | .environment[] | select(.name=="GLW_N8N_RECONNECT_ENABLED").value == "false")
            and (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | .environment[] | select(.name=="GLW_N8N_NON_MUTATING_TEST").value == "true")
            and (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | any(.secrets[]; .name=="GLW_N8N_CALLBACK_SECRET" and (.valueFrom|startswith("arn:aws:secretsmanager:"))))
          ' taskdef.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update ONLY the existing staging service
        id: update_service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" --desired-count 1 --force-new-deployment

      - name: Wait for service stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Validate deployed task definition against preserved baseline
        run: |
          DEPLOYED_TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          if [[ "$DEPLOYED_TD" != "${{ steps.taskdef.outputs.arn }}" ]]; then
            echo "Deployed task definition mismatch. expected=${{ steps.taskdef.outputs.arn }} actual=$DEPLOYED_TD" >&2
            exit 1
          fi
          aws ecs describe-task-definition --task-definition "$DEPLOYED_TD" --query 'taskDefinition' --output json > deployed-taskdef.json
          node infra/staging/staging-taskdef-config-guard.mjs validate \
            --baseline baseline-taskdef.json \
            --candidate deployed-taskdef.json \
            --image "${{ steps.push.outputs.image }}" \
            --git-commit "${{ env.GIT_SHA }}"
          jq -e --arg sha "${{ env.GIT_SHA }}" '
            (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | .image) == "${{ steps.push.outputs.image }}"
            and (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | .environment[] | select(.name=="GIT_COMMIT").value == $sha)
            and (.containerDefinitions[] | select(.name=="GenesisWebRuntime") | .environment[] | select(.name=="GENESIS_RUNTIME_SHA").value == $sha)
          ' deployed-taskdef.json

      - name: Prove target group health (/api/health) on the staging target group
        run: |
          TG=$(aws elbv2 describe-target-groups --names genesis-staging-web --query 'TargetGroups[0].TargetGroupArn' --output text)
          aws elbv2 describe-target-health --target-group-arn "$TG" --query 'TargetHealthDescriptions[].TargetHealth.State' --output text | grep -q healthy

      - name: Probe webhook ingress (unsigned POST must be 401)
        continue-on-error: true
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' https://staging.glwplatform.com/api/share-to-grow/woocommerce/webhook)
          echo "unsigned webhook status: $CODE"
          [ "$CODE" = "401" ]

      - name: Report rollback command if deployment validation fails
        if: failure()
        run: |
          echo "DEPLOYMENT_VALIDATION_FAILED=true"
          echo "PREVIOUS_STAGING_TASK_DEFINITION=${PREVIOUS_STAGING_TASK_DEFINITION:-unknown}"
          echo "Rollback command:"
          echo "aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition ${PREVIOUS_STAGING_TASK_DEFINITION:-<set-task-def-arn>} --desired-count 1 --force-new-deployment"

      - name: Automatic safe rollback on post-deploy validation failure
        if: failure() && steps.update_service.outcome == 'success' && steps.taskdef.outputs.arn != '' && steps.baseline.outputs.previous_task_definition != ''
        run: |
          set -euo pipefail
          current_td="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          candidate_td="${{ steps.taskdef.outputs.arn }}"
          previous_td="${{ steps.baseline.outputs.previous_task_definition }}"
          if ! node infra/staging/rollback-race-guard.mjs --current "$current_td" --candidate "$candidate_td"; then
            echo "ROLLBACK_SKIPPED_RACE_PROTECTION=true"
            echo "Current task definition ($current_td) no longer matches this workflow candidate ($candidate_td); refusing rollback."
            exit 0
          fi
          echo "ROLLBACK_EXECUTED=true"
          echo "ROLLBACK_TO=$previous_td"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$previous_td" --desired-count 1 --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"