name: Genesis Staging Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: genesis-staging-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: genesis-staging-runtime
  ECS_CLUSTER: genesis-production
  ECS_SERVICE: genesis-staging-web
  TASK_FAMILY: genesis-staging-web
  CONTAINER_NAME: GenesisWebRuntime
  AWS_ACCOUNT_ID: "452630323448"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/genesis-staging-runtime-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Share-to-Grow Jest suite
        run: npx jest src/modules/share-to-grow/__tests__ --runInBand

      - name: Share-to-Grow ESLint
        run: npx eslint "src/modules/share-to-grow/**/*.ts" "src/app/api/share-to-grow/**/*.ts" --max-warnings=0

      - name: Production Next.js build
        run: npm run build

      - name: Prove build contains webhook route
        run: |
          test -f .next/server/app/api/share-to-grow/woocommerce/webhook/route.js
          test -f .next/server/app/api/health/route.js

      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t genesis-staging-runtime:${{ github.sha }} .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GenesisGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Guard against production targets
        run: |
          for v in "$ECR_REPOSITORY" "$ECS_SERVICE" "$TASK_FAMILY"; do
            case "$v" in *production*) echo "Refusing production target: $v"; exit 1;; esac
          done

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image and capture digest
        id: push
        run: |
          REPO_URI="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            docker tag genesis-staging-runtime:${{ github.sha }} "$REPO_URI:${{ github.sha }}"
            docker push "$REPO_URI:${{ github.sha }}"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ github.sha }} --query 'imageDetails[0].imageDigest' --output text)
          case "$DIGEST" in sha256:*) ;; *) echo "bad digest: $DIGEST"; exit 1;; esac
          echo "image=$REPO_URI@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prove pushed image contains webhook route
        run: |
          docker run --rm --entrypoint test genesis-staging-runtime:${{ github.sha }} -f .next/server/app/api/share-to-grow/woocommerce/webhook/route.js

      - name: Register task definition revision (production config copied only through the reviewed allowlist)
        id: taskdef
        env:
          IMAGE_URI_WITH_DIGEST: ${{ steps.push.outputs.image }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          bash infra/staging/provision.sh render-taskdef > taskdef.json
          jq -e '.family=="genesis-staging-web" and (.containerDefinitions[0].logConfiguration.options["awslogs-group"]=="/genesis/staging/web")' taskdef.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Create staging service if absent, otherwise update ONLY the staging service
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].status' --output text)
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
              --task-definition "${{ steps.taskdef.outputs.arn }}" --desired-count 1 --force-new-deployment
          else
            TASK_DEFINITION_ARN="${{ steps.taskdef.outputs.arn }}" bash infra/staging/provision.sh service
          fi

      - name: Wait for service stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Prove deployed task runs the digest-pinned image with the webhook route
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].[taskDefinition,runningCount]' --output text
          aws ecs describe-task-definition --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text | grep "${{ steps.push.outputs.image }}"

      - name: Prove target group health (/api/health) on the staging target group
        run: |
          TG=$(aws elbv2 describe-target-groups --names genesis-staging-web --query 'TargetGroups[0].TargetGroupArn' --output text)
          aws elbv2 describe-target-health --target-group-arn "$TG" --query 'TargetHealthDescriptions[].TargetHealth.State' --output text | grep -q healthy

      - name: Probe webhook ingress (unsigned POST must be 401)
        continue-on-error: true
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' https://staging.glwplatform.com/api/share-to-grow/woocommerce/webhook)
          echo "unsigned webhook status: $CODE"
          [ "$CODE" = "401" ]